upstream team_backends {
    server 10.7.16.163:3001 max_fails=2 fail_timeout=10s;
    server 10.7.17.238:3002 max_fails=2 fail_timeout=10s;
}
# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name app.teamX.test api.teamX.test;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;            # nginx < 1.25.1: delete this line and use "listen 443 ssl http2;"
    server_name app.teamX.test api.teamX.test;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/app.teamX.test.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.teamX.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Edge "mac2-primary" always;

    location / {
        proxy_pass http://team_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
